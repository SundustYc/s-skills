interface:
  display_name: "直白点 (zhibaidian)"
  short_description: "揪出生造词和不必要的术语，改回直白说法"
  default_prompt: "Use $zhibaidian to find undefined coined terms, mismatched labels, misused or unnecessary terminology, unexpanded acronyms, and abstraction standing in for mechanism, then rewrite them into plain statements of what actually happens without adding facts. While this skill is active, write your own replies and explanations for the task the same way."
